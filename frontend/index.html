<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMMOExtract — Status Layanan</title>
  </head>
  <body class="min-h-screen bg-[#171738] text-slate-100">
    <main class="mx-auto max-w-2xl px-6 py-16">
      <p class="text-sm font-semibold tracking-widest text-[#00F5D4]">Extract. Transform. Create.</p>
      <h1 class="mt-3 text-4xl font-bold">IMMOExtract</h1>
      <p class="mt-4 text-slate-300">M1 — Fondasi aplikasi dan koneksi layanan lokal.</p>
      <section class="mt-8 rounded-xl border border-white/20 bg-[#4B2A7B]/40 p-6" aria-labelledby="services-title">
        <h2 id="services-title" class="text-xl font-semibold">Status layanan</h2>
        <dl class="mt-5 space-y-4" aria-live="polite" aria-atomic="true">
          <div><dt class="font-semibold">Backend Express</dt><dd id="backend-status" class="mt-1 text-slate-300">Belum diperiksa.</dd></div>
          <div><dt class="font-semibold">FastAPI melalui Express</dt><dd id="ai-status" class="mt-1 text-slate-300">Belum diperiksa.</dd></div>
        </dl>
        <button id="check-status" type="button" class="mt-6 rounded-lg bg-[#00F5D4] px-4 py-2 font-semibold text-[#171738] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#00F5D4] disabled:opacity-50">Periksa ulang</button>
      </section>
      <p class="mt-6 text-sm text-slate-300">Model AI belum dipasang. Upload, ekstraksi, unduhan, dan pixel art belum tersedia.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
